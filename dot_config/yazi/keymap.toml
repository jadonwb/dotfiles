# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[[mgr.prepend_keymap]]
on = "q"
run = "close"
desc = "Close current tab, or quit if it's last"

[[mgr.prepend_keymap]]
on = ["t", "R"]
run = "plugin close-and-restore-tab restore"
desc = "Restore previously closed tab"

[[mgr.prepend_keymap]]
on = [ "t", "t" ]
run = "plugin tree tab_create"
desc = "Tree: tab_create support"

[[mgr.prepend_keymap]]
on = ["t", "v"]
run = "plugin tree toggle"
desc = "Toggle tree view"

[[mgr.prepend_keymap]]
on = ["t", "p"]
run = "plugin tree preview"
desc = "Toggle preview pane"

[[mgr.prepend_keymap]]
on = "h"
run = "plugin tree left"
desc = "Tree: collapse directory or leave"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin tree right"
desc = "Tree: expand directory or enter"

[[mgr.prepend_keymap]]
on = "H"
run = "plugin tree root_up"
desc = "Tree: reroot to parent directory or stock back"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin tree root_down"
desc = "Tree: reroot into directory or reveal file"

[[mgr.prepend_keymap]]
on = "a"
run = "plugin tree create"
desc = "Tree: create at hovered level or stock create"

[[mgr.prepend_keymap]]
on = "A"
run = "plugin tree bulk_create"
desc = "Tree: bulk create at hovered level or stock bulk create"

[[mgr.prepend_keymap]]
on = "p"
run = "plugin tree paste"
desc = "Tree: paste into hovered level or stock paste"

[[mgr.prepend_keymap]]
on = "P"
run = "plugin tree -- paste --force"
desc = "Tree: force paste into hovered level or stock force paste"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin tree open"
desc = "Tree: open file or enter directory"

[[mgr.prepend_keymap]]
on = "f"
run = "plugin tree filter"
desc = "Tree: filter hierarchy or stock filter"

[[mgr.prepend_keymap]]
on = "<Esc>"
run = "plugin tree escape"
desc = "Tree: clear filter or escape"

[[mgr.prepend_keymap]]
on = "<C-[>"
run = "plugin tree escape"
desc = "Tree: clear filter or escape"

[[mgr.prepend_keymap]]
on = "r"
run = "plugin tree rename"
desc = "Tree: rename nested entry or stock rename"

[[mgr.prepend_keymap]]
on = "<A-j>"
run = "seek 1"
desc = "Scroll preview down"

[[mgr.prepend_keymap]]
on = "<A-k>"
run = "seek -1"
desc = "Scroll preview up"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/.netdrive"
desc = "Go to net drive"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd ~/.local/share/Trash/files"
desc = "Go to Trash"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "cd ~/.local"
desc = "Go to user local"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/.local/share/chezmoi"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/c"
desc = "Go to source code"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on = ["R", "p", "p"]
run = "plugin sudo -- paste"
desc = "sudo paste"

# sudo cp/mv --force
[[mgr.prepend_keymap]]
on = ["R", "P"]
run = "plugin sudo -- paste --force"
desc = "sudo paste"

# sudo mv
[[mgr.prepend_keymap]]
on = ["R", "r"]
run = "plugin sudo -- rename"
desc = "sudo rename"

# sudo ln -s (absolute-path)
[[mgr.prepend_keymap]]
on = ["R", "p", "l"]
run = "plugin sudo -- link"
desc = "sudo link"

# sudo ln -s (relative-path)
[[mgr.prepend_keymap]]
on = ["R", "p", "r"]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"

# sudo ln
[[mgr.prepend_keymap]]
on = ["R", "p", "L"]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"

# sudo touch/mkdir
[[mgr.prepend_keymap]]
on = ["R", "a"]
run = "plugin sudo -- create"
desc = "sudo create"

# sudo trash
[[mgr.prepend_keymap]]
on = ["R", "d"]
run = "plugin sudo -- remove"
desc = "sudo trash"

# sudo delete
[[mgr.prepend_keymap]]
on = ["R", "D"]
run = "plugin sudo -- remove --permanently"
desc = "sudo delete"

[[mgr.prepend_keymap]]
on = ["<C-y>"]
run = "plugin wl-clipboard"

[[mgr.prepend_keymap]]
on = ["c", "p"]
run = "plugin convert -- --extension='png'"
desc = "Convert selected files to PNG"

[[mgr.prepend_keymap]]
on = ["c", "j"]
run = "plugin convert -- --extension='jpg'"
desc = "Convert selected files to JPG"

[[mgr.prepend_keymap]]
on = ["c", "w"]
run = "plugin convert -- --extension='webp'"
desc = "Convert selected files to WebP"

[[mgr.prepend_keymap]]
on = ["R", "s"]
run = "plugin rsync"
desc = "Copy files using rsync"
